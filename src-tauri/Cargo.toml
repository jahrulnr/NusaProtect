[package]
name = "nusaprotect"
version = "3.2.0"
authors = ["Elane Faisal-Sage <elane@linux.com>", "Jahrulnr"]
license = "GPL-2.0"
rust-version = "1.90"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gpapi = { path = "../router/crates/gpapi", features = ["clap", "webview-auth"] }
common = { path = "../router/crates/common" }
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
log = "0.4"
clap = { version = "4", features = ["derive"] }
compile-time = "0.2"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[features]
default = ["tauri/custom-protocol"]
